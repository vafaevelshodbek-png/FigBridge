name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter figbridge exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: pnpm --filter figbridge exec playwright install chromium
        if: runner.os != 'Linux'
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
      # One job measures coverage and enforces the floor in vitest.config.ts.
      - run: pnpm test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - run: pnpm --filter figbridge test:browser
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      # Pack, install with plain npm into an empty directory, run the CLI and the MCP server.
      - run: pnpm -F figbridge smoke
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}-node${{ matrix.node }}
          path: test-output/golden/
          if-no-files-found: ignore
